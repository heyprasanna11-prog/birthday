<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Theertha ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Cool Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            background: black;
        }

        /* Moving space background */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, #ff003c, #000814, #000);
            animation: moveBg 10s linear infinite;
            z-index: -2;
        }

        @keyframes moveBg {
            0% { transform: translate(0,0); }
            50% { transform: translate(-25%, -25%); }
            100% { transform: translate(0,0); }
        }

        /* Marvel-style glowing title */
        h1 {
            font-size: 48px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: titleEntry 2s ease-out forwards, glow 2s infinite alternate;
            opacity: 0;
        }

        @keyframes titleEntry {
            from { transform: scale(0.2); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff003c; }
            to { text-shadow: 0 0 30px #ffea00, 0 0 50px #ff003c; }
        }

        p {
            margin-top: 10px;
            font-size: 18px;
            opacity: 0.9;
        }

        button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(45deg, #ff003c, #ffea00);
            color: black;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #ff003c;
        }

        #msg {
            display: none;
            margin-top: 25px;
            font-size: 20px;
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        /* Floating light particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% {transform: translateY(0); opacity: 1;}
            100% {transform: translateY(-100vh); opacity: 0;}
        }

        @media(max-width:600px){
            h1{font-size:32px;}
        }
    </style>
</head>

<body>

    <h1>Happy Birthday Theertha ❤️</h1>
    <p>Superhero of my life ✨ Tap below</p>

    <button onclick="showMessage()">Reveal Surprise 💖</button>

    <div id="msg">
        enjoy your day superhero 🦸‍♀️❤️<br>
        Stay amazing, stay you 💫<br>
        once again Happy Birthday Madam🎂💖
    </div>

    <script>
        function showMessage() {
            document.getElementById("msg").style.display = "block";
        }

        function createParticle() {
            const p = document.createElement("div");
            p.classList.add("particle");
            p.style.left = Math.random() * 100 + "vw";
            p.style.animationDuration = (Math.random() * 3 + 3) + "s";
            document.body.appendChild(p);
            setTimeout(() => { p.remove(); }, 6000);
        }

        setInterval(createParticle, 100);
    </script>

</body>
</html>

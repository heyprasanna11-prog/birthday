<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday Theertha ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Cool Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 20% 20%, #1a1a2e, #0f0f1a 60%);
      overflow: hidden;
      color: white;
    }

    /* Smooth moving stars */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      z-index: -1;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      opacity: 0.8;
      animation: floatStar linear infinite;
    }

    @keyframes floatStar {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); }
    }

    /* Glass card */
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255,0,100,0.2);
      animation: fadeUp 1.8s ease forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h1 {
      font-size: 42px;
      font-weight: 600;
      color: #ff4b7d;
      text-shadow: 0 0 15px #ff4b7d;
    }

    p {
      margin-top: 10px;
      font-size: 16px;
      opacity: 0.8;
    }

    button {
      margin-top: 25px;
      padding: 12px 30px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(45deg, #ff4b7d, #ff8fab);
      color: white;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px #ff4b7d;
    }

    #msg {
      margin-top: 20px;
      font-size: 16px;
      display: none;
      line-height: 1.6;
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @media(max-width:600px){
      .card { padding: 30px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>

<body>

  <div class="stars" id="stars"></div>

  <div class="card">
    <h1>Happy Birthday Theertha ❤️</h1>
    <p>The most beautiful soul in my universe ✨</p>
    <button onclick="showMessage()">Open Your Surprise 💖</button>

    <div id="msg">
      Theertha, you make my world brighter every day 🌟<br>
      Life feels magical with you 💫<br>
      Keep smiling, keep shining ✨<br>
      I’m lucky to have you ❤️<br>
      Happy Birthday 🎂💖
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("msg").style.display = "block";
    }

    // Generate smooth stars
    const starContainer = document.getElementById("stars");
    for (let i = 0; i < 80; i++) {
      const star = document.createElement("div");
      star.classList.add("star");
      star.style.left = Math.random() * 100 + "vw";
      star.style.animationDuration = (Math.random() * 5 + 5) + "s";
      star.style.opacity = Math.random();
      starContainer.appendChild(star);
    }
  </script>

</body>
</html>
